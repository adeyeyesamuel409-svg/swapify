AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - VPC, subnets, NAT routing and security groups (production, us-east-1)"

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: Environment name used in resource tags.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[12][0-9]|3[0-2]))$
    Description: CIDR block for the VPC.
  PublicSubnetCidrs:
    Type: List<String>
    Default: "10.0.1.0/24,10.0.2.0/24,10.0.3.0/24"
    ConstraintDescription: Comma-delimited list of 3 CIDR blocks, one per public subnet (ALB).
  AppSubnetCidrs:
    Type: List<String>
    Default: "10.0.11.0/24,10.0.12.0/24,10.0.13.0/24"
    ConstraintDescription: Comma-delimited list of 3 CIDR blocks, one per private app subnet (ECS Fargate).
  DbSubnetCidrs:
    Type: List<String>
    Default: "10.0.21.0/24,10.0.22.0/24,10.0.23.0/24"
    ConstraintDescription: Comma-delimited list of 3 CIDR blocks, one per private database subnet (RDS).
  AvailabilityZones:
    Type: List<String>
    Default: "us-east-1a,us-east-1b,us-east-1c"
    ConstraintDescription: Comma-delimited list of 3 AZs. Must match the listed subnet CIDRs in order.
  NatGateways:
    Type: Number
    Default: 1
    AllowedValues: [1, 3]
    Description: 1 = single NAT gateway in the first AZ (cost-optimised). 3 = one per AZ (high availability).

Conditions:
  NatGatewaysEquals1: !Equals [!Ref NatGateways, 1]
  NatGatewaysEquals3: !Equals [!Ref NatGateways, 3]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-igw"
  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # --- Public subnets (ALB, NAT gateways) ------------------------------------
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Ref PublicSubnetCidrs]
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-public-1"
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Ref PublicSubnetCidrs]
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-public-2"
  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Ref PublicSubnetCidrs]
      AvailabilityZone: !Select [2, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-public-3"

  # --- Private app subnets (ECS Fargate API + web) ---------------------------
  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Ref AppSubnetCidrs]
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-1"
  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Ref AppSubnetCidrs]
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-2"
  AppSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Ref AppSubnetCidrs]
      AvailabilityZone: !Select [2, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-3"

  # --- Private database subnets (RDS, no RDS cloud subnets) ------------------
  DbSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [0, !Ref DbSubnetCidrs]
      AvailabilityZone: !Select [0, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-db-1"
  DbSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [1, !Ref DbSubnetCidrs]
      AvailabilityZone: !Select [1, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-db-2"
  DbSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Select [2, !Ref DbSubnetCidrs]
      AvailabilityZone: !Select [2, !Ref AvailabilityZones]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-db-3"

  # --- NAT gateways ----------------------------------------------------------
  NatEip1:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-eip-1"
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-1"
  NatEip2:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-eip-2"
  NatGateway2:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-2"
  NatEip3:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-eip-3"
  NatGateway3:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip3.AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-nat-3"

  # --- Public routing (0.0.0.0/0 -> IGW) -------------------------------------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-public-rt"
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  # --- Private app routing (0.0.0.0/0 -> NAT) --------------------------------
  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-rt"
  AppRouteToNat1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway1
  AppRouteTable2:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-rt-2"
  AppRoute2ToNat2:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway2
  AppRouteTable3:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-app-rt-3"
  AppRoute3ToNat3:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable3
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway3

  AppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref AppRouteTable
  AppSubnet2RouteTableAssociationSingle:
    Condition: NatGatewaysEquals1
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref AppRouteTable
  AppSubnet2RouteTableAssociationMulti:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref AppRouteTable2
  AppSubnet3RouteTableAssociationSingle:
    Condition: NatGatewaysEquals1
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet3
      RouteTableId: !Ref AppRouteTable
  AppSubnet3RouteTableAssociationMulti:
    Condition: NatGatewaysEquals3
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet3
      RouteTableId: !Ref AppRouteTable3

  # --- Private database routing (local only, no internet) --------------------
  DbRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-db-rt"
  DbSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet1
      RouteTableId: !Ref DbRouteTable
  DbSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet2
      RouteTableId: !Ref DbRouteTable
  DbSubnet3RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DbSubnet3
      RouteTableId: !Ref DbRouteTable

  # --- Security groups -------------------------------------------------------
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Swapify application load balancer (HTTPS from the internet)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-alb-sg"

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Swapify API Fargate service (ingress from ALB only)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 4000
          ToPort: 4000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-api-sg"

  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Swapify web Fargate service (ingress from ALB only)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-web-sg"

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Swapify RDS PostgreSQL (ingress from API service only, no public access)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}-rds-sg"

Outputs:
  VpcId:
    Description: VPC ID for the API, web and database stacks.
    Value: !Ref Vpc
  PublicSubnetIds:
    Description: Comma-delimited public subnet IDs (ALB, NAT gateways).
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
  AppSubnetIds:
    Description: Comma-delimited private app subnet IDs (ECS Fargate).
    Value: !Join [",", [!Ref AppSubnet1, !Ref AppSubnet2, !Ref AppSubnet3]]
  DbSubnetIds:
    Description: Comma-delimited private database subnet IDs (RDS).
    Value: !Join [",", [!Ref DbSubnet1, !Ref DbSubnet2, !Ref DbSubnet3]]
  LoadBalancerSecurityGroupId:
    Description: Security group ID for the ALB; pass to the ECS stack.
    Value: !Ref LoadBalancerSecurityGroup
  ApiSecurityGroupId:
    Description: Security group ID for the API service; pass to the ECS stack.
    Value: !Ref ApiSecurityGroup
  WebSecurityGroupId:
    Description: Security group ID for the web service; pass to the ECS stack.
    Value: !Ref WebSecurityGroup
  RdsSecurityGroupId:
    Description: Security group ID for RDS; pass to the RDS stack.
    Value: !Ref RdsSecurityGroup