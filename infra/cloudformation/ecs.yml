AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - ECS Fargate services for the API and web app behind an Application Load Balancer"

Parameters:
  EnvName:
    Type: String
    Default: prod
  VpcId:
    Type: AWS::EC2::VPC::Id
  LoadBalancerSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  ApiSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  WebSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output LoadBalancerSecurityGroupId.
  ApiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output ApiSecurityGroupId.
  WebSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output WebSecurityGroupId.
  ApiImage:
    Type: String
    Description: 'ECR image URI for the API: <account>.dkr.ecr.us-east-1.amazonaws.com/swapify-api:<git-sha> (build with npm run build -w @swapify/api; NODE_ENV=production).'
  WebImage:
    Type: String
    Description: 'ECR image URI for the web app: <account>.dkr.ecr.us-east-1.amazonaws.com/swapify-web:<git-sha> (build with NEXT_PUBLIC_IMAGE_BASE_URL set to the CDN base URL).'
  ApiDomainName:
    Type: String
    Description: Public host for the API, e.g. api.swapifyuk.com
  WebDomainName:
    Type: String
    Description: Public host for the web app, e.g. swapifyuk.com
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering ApiDomainName, WebDomainName and the www.swapifyuk.com SAN.
  ApiDesiredCount:
    Type: Number
    Default: 1
  ApiRunsReconciliation:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Whether each API task also runs the in-process reconciliation sweeper.
      Set false so the scheduled ReconcilerTaskDefinition is the single owner of
      financial reconciliation (swap expiry, refunds, value gaps, withdrawals).
      Deploy order: create the stack with true first, confirm the reconciler
      schedule is firing, then update this parameter to false. Setting it to
      false with no working schedule stops all reconciliation.
  ReconcilerScheduleExpression:
    Type: String
    Default: "rate(5 minutes)"
    AllowedPattern: "^(rate|cron)\\(.+\\)$"
    Description: >-
      EventBridge Scheduler expression for the one-shot reconciliation task.
      rate(5 minutes) matches the previous in-process sweeper cadence.
  WebDesiredCount:
    Type: Number
    Default: 1
  ApiCpu:
    Type: String
    Default: "256"
  ApiMemory:
    Type: String
    Default: "512"
  WebCpu:
    Type: String
    Default: "1024"
  WebMemory:
    Type: String
    Default: "2048"
  CognitoRegion:
    Type: String
    Default: us-east-1
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CognitoIssuer:
    Type: String
    Description: https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
  S3Bucket:
    Type: String
  S3Prefix:
    Type: String
    Default: uploads
  CdnBaseUrl:
    Type: String
    Description: CloudFront base URL from the storage stack output.
  StorageAccessPolicyArn:
    Type: String
    Description: ApiStorageAccessPolicyArn from the storage stack.
  DatabaseUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/database-url.
  StripeSecretKeySecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/stripe/secret-key.
  StripeWebhookSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/stripe/webhook-secret.
  NextAuthSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/web/nextauth-secret.
  CognitoClientSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/web/cognito-client-secret.

  # --- P1.1 credential rotation resilience ---------------------------------
  # RDS stores its master password in an RDS-managed secret and rotates it on a
  # schedule (every 7 days in production). The application does not read that
  # secret: the API and reconciler tasks receive DATABASE_URL by ECS task-launch
  # injection from the separately maintained swapify/database-url, and nothing
  # copied the rotated password across. Each rotation therefore broke production
  # until a human noticed (~37.7h, once). The sync resources below close that gap.
  RdsMasterSecretArn:
    Type: String
    Description: >-
      Secrets Manager ARN of the RDS-managed master secret (rds!db-*). Authoritative
      credential source. It is only ever read.
  CredentialSyncScheduleExpression:
    Type: String
    Default: rate(5 minutes)
    Description: >-
      How often the credential sync function polls. Keep at or below the reconciler
      cadence so a rotation is caught before the next reconciliation run.

Resources:
  # --- Networking -----------------------------------------------------------
  # VPC, subnets, NAT routing and all security groups are owned by
  # infra/cloudformation/networking.yml and consumed via parameters.

  # --- IAM ------------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadTaskSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref StripeSecretKeySecretArn
                  - !Ref StripeWebhookSecretSecretArn
                  - !Ref NextAuthSecretSecretArn
                  - !Ref CognitoClientSecretSecretArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StorageAccessPolicyArn
      Policies:
        - PolicyName: ReadApiSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref StripeSecretKeySecretArn
                  - !Ref StripeWebhookSecretSecretArn

  # Reconciliation worker task role. Least privilege: the one-shot reconciler
  # needs the database URL and the Stripe key, and nothing else. It deliberately
  # does NOT inherit ApiTaskRole's storage policy (the reconciler never touches
  # S3/CloudFront) or the webhook secret (webhook verification stays in the API).
  ReconcilerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadReconcilerSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref StripeSecretKeySecretArn

  # EventBridge Scheduler needs permission to start the reconciler task and to
  # pass the task/execution roles to ECS. Scoped to this one task definition, so
  # the schedule cannot start anything else in the cluster.
  ReconcilerScheduleRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunReconcilerTask
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:RunTask
                  - ecs:StopTask
                Resource: !Ref ReconcilerTaskDefinition
                Condition:
                  ArnEquals:
                    ecs:cluster: !GetAtt Cluster.Arn
              - Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt ExecutionRole.Arn
                  - !GetAtt ReconcilerTaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadWebSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref NextAuthSecretSecretArn
                  - !Ref CognitoClientSecretSecretArn

  # --- Cluster + tasks ------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "swapify-${EnvName}"
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "swapify-api-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          Cpu: 0
          HealthCheck:
            Command: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: APP_ROLE
              Value: api
            # Explicit reconciliation ownership: when false, this task serves
            # HTTP only and the scheduled reconciler owns the sweep cycle.
            - Name: RECONCILE_IN_PROCESS
              Value: !Ref ApiRunsReconciliation
            - Name: PORT
              Value: "4000"
            - Name: HOST
              Value: 0.0.0.0
            - Name: LOG_LEVEL
              Value: info
            - Name: AWS_REGION
              Value: !Ref CognitoRegion
            - Name: COGNITO_REGION
              Value: !Ref CognitoRegion
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: WEB_BASE_URL
              Value: !Sub "https://${WebDomainName}"
            - Name: STORAGE_DRIVER
              Value: s3
            - Name: S3_BUCKET
              Value: !Ref S3Bucket
            - Name: S3_PREFIX
              Value: !Ref S3Prefix
            - Name: CDN_BASE_URL
              Value: !Ref CdnBaseUrl
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
            - Name: STRIPE_SECRET_KEY
              ValueFrom: !Ref StripeSecretKeySecretArn
            - Name: STRIPE_WEBHOOK_SECRET
              ValueFrom: !Ref StripeWebhookSecretSecretArn
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "swapify-web-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WebCpu
      Memory: !Ref WebMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImage
          Essential: true
          Cpu: 0
          HealthCheck:
            Command: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - Name: NODE_ENV
              Value: production
            # Next.js standalone binds its HTTP server to process.env.HOSTNAME.
            # ECS injects HOSTNAME as the task's private hostname (not loopback),
            # which breaks the container health check hitting localhost. Pin it
            # to 0.0.0.0 so the server listens on all interfaces.
            - Name: HOSTNAME
              Value: 0.0.0.0
            - Name: NEXTAUTH_URL
              Value: !Sub "https://${WebDomainName}"
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: COGNITO_ISSUER
              Value: !Ref CognitoIssuer
            - Name: API_URL
              Value: !Sub "https://${ApiDomainName}"
          Secrets:
            - Name: NEXTAUTH_SECRET
              ValueFrom: !Ref NextAuthSecretSecretArn
            - Name: COGNITO_CLIENT_SECRET
              ValueFrom: !Ref CognitoClientSecretSecretArn
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: web

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "swapify-api-${EnvName}"
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiSecurityGroupId]
          Subnets: !Ref ApiSubnets
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup

  # One-shot reconciliation task. Started by EventBridge Scheduler, runs a
  # single reconciliation cycle, exits. Not registered with the load balancer,
  # binds no port and has no health check, so it is not a second API.
  #
  # It runs in the API subnets/security group on purpose: networking.yml allows
  # RDS ingress (5432) only from ApiSecurityGroupId, and the app subnets reach
  # Stripe through the NAT gateway. No new security-group rules are required.
  # A one-shot task here is not reachable from the ALB — only tasks attached to
  # the target group receive ALB traffic.
  ReconcilerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "swapify-reconciler-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ReconcilerTaskRole.Arn
      ContainerDefinitions:
        - Name: reconciler
          Image: !Ref ApiImage
          Essential: true
          Cpu: 0
          # Override the image CMD with the one-shot entry point. Same image as
          # the API, so the worker can never drift from the API's code.
          Command: ["node", "apps/api/dist/reconcile-once.js"]
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: APP_ROLE
              Value: worker
            - Name: LOG_LEVEL
              Value: info
            - Name: AWS_REGION
              Value: !Ref CognitoRegion
          # No PortMappings and no HealthCheck: the worker serves no HTTP, and a
          # health check against :4000 would fail forever.
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
            - Name: STRIPE_SECRET_KEY
              ValueFrom: !Ref StripeSecretKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ReconcilerLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: reconciler

  WebService:
    Type: AWS::ECS::Service
    DependsOn: WebListenerRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "swapify-web-${EnvName}"
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref WebDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref WebSecurityGroupId]
          Subnets: !Ref WebSubnets
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup

  # --- Reconciliation schedule ------------------------------------------------
  #
  # One task per interval, started by EventBridge Scheduler (managed schedule,
  # no rule/permission juggling, built-in retry). At-least-once delivery: the
  # schedule may overlap a previous run that is still starting, and an ECS task
  # can be killed mid-cycle. Every reconciliation transition is an idempotent
  # conditional update, so a duplicate or partial run is safe — this schedule
  # never makes a run exactly-once, and no lock is used to pretend otherwise.
  ReconcilerSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "swapify-reconciler-${EnvName}"
      ScheduleExpression: !Ref ReconcilerScheduleExpression
      # OFF = fire on the exact interval, even if the previous run overran.
      # FLEXIBLE would skip an interval instead, which would silently delay
      # reconciliation; a duplicate run is safe, a missed run is not.
      # Quoted: unquoted OFF is YAML 1.1 boolean false, not the string "OFF".
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt Cluster.Arn
        RoleArn: !GetAtt ReconcilerScheduleRole.Arn
        # Retries on top of the schedule itself: a task that fails because ECS
        # or the network was briefly unavailable gets another attempt.
        RetryPolicy:
          MaximumEventAgeInSeconds: 3600
          MaximumRetryAttempts: 2
        EcsParameters:
          TaskDefinitionArn: !Ref ReconcilerTaskDefinition
          LaunchType: FARGATE
          PlatformVersion: "LATEST"
          NetworkConfiguration:
            AwsvpcConfiguration:
              AssignPublicIp: DISABLED
              SecurityGroups: [!Ref ApiSecurityGroupId]
              Subnets: !Ref ApiSubnets

  # --- Load balancer --------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "swapify-alb-${EnvName}"
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroupId]
      Subnets: !Ref LoadBalancerSubnets

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "swapify-api-tg-${EnvName}"
      VpcId: !Ref VpcId
      Port: 4000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "swapify-web-tg-${EnvName}"
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref ApiDomainName]

  # Canonical web hostname is https://swapifyuk.com (apex). www.swapifyuk.com is
  # covered by the certificate SAN and redirected 301 to the apex below. Without
  # this dedicated redirect rule, www traffic would fall through to the HTTPS
  # listener's default action and be served by the web target group under the
  # www hostname (breaking auth/CORS). The redirect rule must be deployed with
  # this stack BEFORE a www.swapifyuk.com DNS record is created.
  WebListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref WebDomainName]

  # Permanent redirect: www.swapifyuk.com -> https://swapifyuk.com (apex), 301.
  # Preserves the request path and query string. Distinct priority (30); the
  # API rule uses 10 and the apex rule uses 20.
  WwwRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 30
      Actions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            Host: swapifyuk.com
            Path: "/#{path}"
            Query: "#{query}"
            StatusCode: HTTP_301
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - www.swapifyuk.com

  # --- Logging --------------------------------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/api"
      RetentionInDays: 30
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/web"
      RetentionInDays: 30
  ReconcilerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/reconciler"
      RetentionInDays: 30

  # --- Reconciliation observability (R3.38) ---------------------------------
  # READ-ONLY / NON-FINANCIAL. Nothing in this block changes reconciliation
  # behaviour, the schedule expression, the schedule state, the scheduler
  # target, any ECS task definition, the API or web service, the database,
  # or any Stripe configuration. It only derives telemetry from the
  # reconciler's EXISTING log output and from ECS task state events.
  #
  # Why these signals:
  #  * ReconcilerRunStarted emits a datapoint only when a worker actually
  #    starts, so an empty 5-minute window means no invocation happened at all.
  #    That one metric covers scheduler disabled, ECS launch failure, secret
  #    injection failure and config validation failure.
  #  * ReconcilerRunFailed counts fatal exits and propagating cycle failures.
  #  * ReconcilerStepError counts step errors that are logged and swallowed,
  #    so the worker can still exit 0 and no exit-code check can see them.
  #  * ReconcilerRunDuration extracts the durationMs value the reconciler
  #    already writes at the JSON root of every cycle, so no application
  #    logging change is needed to produce it.
  #
  # Division of responsibility, to avoid double paging:
  #  * Silence belongs to the missing-execution alarm, and only to it, so it
  #    treats missing data as breaching.
  #  * The error and duration alarms are threshold alarms and explicitly treat
  #    missing data as not breaching, so a quiet period is never an error.
  ReconciliationAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      # Deliberately has no subscription: alerts have no operator recipient
      # until one is confirmed. Nothing is wired to canary-demo.
      TopicName: !Sub "swapify-reconciliation-alerts-${EnvName}"
      DisplayName: !Sub "Swapify ${EnvName} reconciliation alerts"

  ReconcilerRunStartedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ReconcilerLogGroup
      FilterName: ReconcilerRunStarted
      # Matches reconcile-once.ts "One-shot reconciliation worker starting".
      # Validated against real log events with the Logs TestMetricFilter API.
      FilterPattern: '{ $.msg = "One-shot reconciliation worker starting" }'
      MetricTransformations:
        - MetricNamespace: !Sub "Swapify/${EnvName}/Reconciliation"
          MetricName: ReconcilerRunStarted
          MetricValue: "1"
          # Publish 0 during quiet windows so the series stays continuous. The
          # alarm still breaches at 0 < 1, and TreatMissingData=breaching still
          # covers the case where even this datapoint is absent.
          DefaultValue: 0
          Unit: Count

  ReconcilerRunFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ReconcilerLogGroup
      FilterName: ReconcilerRunFailed
      # "Sweep cycle failed" is the propagating top-level failure in sweeper.ts;
      # the other term is the fatal handler in reconcile-once.ts. Both mean the
      # run did not succeed. The trailing wildcard avoids depending on the exact
      # wording (and non-ASCII dash) after "failed".
      FilterPattern: '{ $.msg = "FATAL: one-shot reconciliation failed*" || $.msg = "Sweep cycle failed" }'
      MetricTransformations:
        - MetricNamespace: !Sub "Swapify/${EnvName}/Reconciliation"
          MetricName: ReconcilerRunFailed
          MetricValue: "1"
          Unit: Count

  ReconcilerStepErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ReconcilerLogGroup
      FilterName: ReconcilerStepError
      # Step-level errors in sweeper.ts that are logged and then swallowed, so
      # the process can still exit 0. "Sweep cycle failed" is deliberately NOT
      # included here: it propagates and is already counted as a run failure.
      FilterPattern: '{ $.msg = "Failed to reconcile value gaps" || $.msg = "Failed to reconcile withdrawals" || $.msg = "Failed to reconcile refund" || $.msg = "Failed to expire swap" || $.msg = "Failed to cancel shipments during swap expiry" }'
      MetricTransformations:
        - MetricNamespace: !Sub "Swapify/${EnvName}/Reconciliation"
          MetricName: ReconcilerStepError
          MetricValue: "1"
          Unit: Count

  ReconcilerRunDurationMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ReconcilerLogGroup
      FilterName: ReconcilerRunDuration
      # reconciler.ts logs { expiredSwaps, durationMs } at the JSON root on
      # every cycle, so this yields a real numeric millisecond duration.
      FilterPattern: '{ $.durationMs = * }'
      MetricTransformations:
        - MetricNamespace: !Sub "Swapify/${EnvName}/Reconciliation"
          MetricName: ReconcilerRunDuration
          MetricValue: "$.durationMs"
          Unit: Milliseconds

  ReconcilerMissingExecutionAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-reconciler-missing-execution"
      AlarmDescription: "No reconciler run started for two consecutive 5-minute windows (~10-11 minutes). Detects scheduler disabled, ECS launch failure, secret injection failure or config validation failure."
      Namespace: !Sub "Swapify/${EnvName}/Reconciliation"
      MetricName: ReconcilerRunStarted
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      # One run per 5-minute window is the expected value, so anything below
      # one is a missed window. Two consecutive evaluations are required, so a
      # single boundary cannot false-alarm on ordinary jitter.
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref ReconciliationAlertTopic
      OKActions:
        - !Ref ReconciliationAlertTopic

  ReconcilerRunFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-reconciler-run-failed"
      AlarmDescription: "At least one reconciler execution reported a fatal failure or a propagating sweep cycle failure."
      Namespace: !Sub "Swapify/${EnvName}/Reconciliation"
      MetricName: ReconcilerRunFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReconciliationAlertTopic
      OKActions:
        - !Ref ReconciliationAlertTopic

  ReconcilerStepErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-reconciler-step-error"
      AlarmDescription: "Reconciliation step errors were logged. These steps catch and swallow their own errors, so the worker can still exit 0 and an exit-code check would miss them."
      Namespace: !Sub "Swapify/${EnvName}/Reconciliation"
      MetricName: ReconcilerStepError
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReconciliationAlertTopic
      OKActions:
        - !Ref ReconciliationAlertTopic

  ReconcilerRunDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-reconciler-run-duration"
      AlarmDescription: "Average reconciler cycle duration exceeded 30000 ms. The observed healthy range is 124-289 ms, so this threshold sits deliberately far above normal runtime variance; it detects gross slowdown, not latency SLOs."
      Namespace: !Sub "Swapify/${EnvName}/Reconciliation"
      MetricName: ReconcilerRunDuration
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 30000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReconciliationAlertTopic
      OKActions:
        - !Ref ReconciliationAlertTopic

  ReconcilerTaskEventLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/reconciler-task-events"
      RetentionInDays: 30

  ReconcilerTaskStateChangeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "swapify-${EnvName}-reconciler-task-state-change"
      Description: "ECS task state changes for the Swapify reconciler task definition only. Provides durable evidence of launch failures, exit codes and stopped reasons, which ECS otherwise retains for only about one hour."
      EventPattern:
        source:
          - aws.ecs
        detail-type:
          - ECS Task State Change
        detail:
          clusterArn:
            - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:cluster/swapify-${EnvName}"
          taskDefinitionArn:
            - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task-definition/swapify-reconciler-${EnvName}:*"
      State: ENABLED
      Targets:
        - Id: reconciler-task-events
          Arn: !GetAtt ReconcilerTaskEventLogGroup.Arn
          # Logs only. No SNS target here on purpose: every run emits several
          # task state changes, so notifying on the event itself would page on
          # healthy operation. Failures are raised by the alarm below instead.
          InputTransformer:
            InputPathsMap:
              detailType: "$.detail-type"
              cluster: "$.detail.clusterArn"
              taskDef: "$.detail.taskDefinitionArn"
              taskArn: "$.detail.taskArn"
              status: "$.detail.status"
              stoppedReason: "$.detail.stoppedReason"
              containers: "$.detail.containers"
              startedAt: "$.detail.startedAt"
              stoppedAt: "$.detail.stoppedAt"
            InputTemplate: '{"detailType":"<detailType>","cluster":"<cluster>","taskDef":"<taskDef>","taskArn":"<taskArn>","status":"<status>","stoppedReason":"<stoppedReason>","containers":"<containers>","startedAt":"<startedAt>","stoppedAt":"<stoppedAt>"}'

  ReconcilerTaskFailedMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ReconcilerTaskEventLogGroup
      FilterName: ReconcilerTaskFailed
      # Exact equality on the JSON field, so a task failure is counted regardless of
      # the exit code or AWS wording appended after it. "Essential container in
      # task exited" is the observed stoppedReason for non-zero exits; the two
      # wildcard terms cover image-pull and resource-init launch failures.
      FilterPattern: '{ $.stoppedReason = "Essential container in task exited" || $.stoppedReason = "CannotPullContainerError*" || $.stoppedReason = "ResourceInitializationError*" }'
      MetricTransformations:
        - MetricNamespace: !Sub "Swapify/${EnvName}/Reconciliation"
          MetricName: ReconcilerTaskFailed
          MetricValue: "1"
          Unit: Count

  ReconcilerTaskFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-reconciler-task-failed"
      AlarmDescription: "An ECS task state change for the reconciler reported a non-zero essential-container exit or a launch/placement failure. Catches crashes that never reach the worker's own logging."
      Namespace: !Sub "Swapify/${EnvName}/Reconciliation"
      MetricName: ReconcilerTaskFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref ReconciliationAlertTopic
      OKActions:
        - !Ref ReconciliationAlertTopic

  # --- P1.1 credential rotation resilience ---------------------------------
  #
  # Trigger choice is forced by what actually works in this account, not by
  # preference. The default EventBridge bus delivers no AWS service events here:
  # probed twice, for ECS/Scheduler service events during R3.38 and for
  # Secrets Manager API events during P1.1, with an enabled rule and real API
  # calls both times, zero events delivered. So no event-driven trigger exists
  # here. EventBridge Scheduler does work (it drives the reconciler every five
  # minutes), so the sync function polls instead of reacting to an event.
  #
  # Note on rotation-in-progress detection: the presence of an AWSPENDING staging
  # label is deliberately NOT used as the signal. RDS left a stale AWSPENDING
  # label on this secret that AWS never cleared, so treating it as "rotation
  # active" would block synchronization permanently. The function uses
  # LastChangedDate plus a stable AWSCURRENT version id instead.
  #
  # What is deliberately absent: any rds:* permission. This function cannot
  # rotate the database password, modify the instance, restart it, or write to
  # the authoritative secret.
  CredentialSyncLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/swapify-credential-sync-${EnvName}"
      RetentionInDays: 30

  CredentialSyncFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadAuthoritativeSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read-only, and only this one secret. No wildcard, and no write
              # action, so the authoritative value cannot be altered from here.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref RdsMasterSecretArn
        - PolicyName: SyncApplicationSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Only the application secret is writable, and only this one.
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref DatabaseUrlSecretArn
        - PolicyName: ReadWriteSyncState
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # One parameter. It holds only an opaque version id, never a
              # credential.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/swapify/${EnvName}/credential-sync/rds-source-version"
        - PolicyName: EmitSyncMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: !Sub "Swapify/${EnvName}/CredentialSync"
        - PolicyName: RedeployApiService
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Exactly one service, addressed by its service ARN, so this role
              # cannot roll anything else in the account. Needed because the API
              # is a long-running task with the secret baked in at launch, so a
              # new deployment is the only way it picks up a rotated credential.
              # The reconciler needs nothing here: it gets a fresh task per run.
              #
              # ${ApiService.Name}, NOT ${ApiService}: Ref on an AWS::ECS::Service
              # returns the service ARN, not its name, so Ref here would produce
              # a doubly-nested ARN that matches nothing and silently deny the
              # redeploy at rotation time.
              - Effect: Allow
                Action: ecs:UpdateService
                Resource: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/${Cluster}/${ApiService.Name}"
        - PolicyName: WriteOwnLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The log group is created by this stack, so the function only needs
              # to stream into it. Without this it would run with no diagnostics
              # at all, which is the opposite of what this control is for.
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/swapify-credential-sync-${EnvName}:*"

  CredentialSyncFunction:
    Type: AWS::Lambda::Function
    DependsOn: CredentialSyncLogGroup
    Properties:
      FunctionName: !Sub "swapify-credential-sync-${EnvName}"
      Description: >-
        Keeps the application DATABASE_URL aligned with the RDS-managed master
        credential after AWS rotates it, and reports divergence. Reads the
        authoritative secret only and holds no rds:* permission.
      Runtime: python3.12
      Handler: index.lambda_handler
      Timeout: 60
      MemorySize: 128
      # No ReservedConcurrentExecutions here. This account has a total concurrency
      # limit of 10 with all 10 unreserved, and AWS refuses any reservation that
      # would push the unreserved pool below its minimum of 10. Serialising is
      # instead guaranteed structurally: the poll runs in about a second and the
      # 60s timeout is well inside the five-minute cadence, so two invocations
      # cannot overlap. The handler is also idempotent, re-reading the source
      # version before writing.
      Role: !GetAtt CredentialSyncFunctionRole.Arn
      # Source of truth is infra/lambda/credential_sync.py. A unit test asserts
      # this block stays byte-identical to that file.
      Code:
        ZipFile: |
          """P1.1 - keep the application DATABASE_URL aligned with RDS managed rotation.

          Why this exists
          ---------------
          RDS stores its master password in an RDS-managed secret and rotates it on a
          schedule (every 7 days in production). The application does not read that
          secret: both the API task and the one-shot reconciler receive DATABASE_URL by
          ECS task-launch injection from a separate, manually maintained secret
          (swapify/database-url). Nothing copied the rotated password across, so every
          rotation silently invalidated the application copy and took production down
          (observed once: ~37.7h, reconciler 100% failure and API health checks failing).

          This function closes that gap. It polls on a schedule, notices when the
          authoritative RDS secret has moved to a new version, and rewrites only the
          password component of the application secret.

          Safety model
          ------------
          * The RDS-managed secret is the authoritative source and is READ ONLY here.
            This function's execution role holds no rds:* permission at all, so it
            structurally cannot rotate the database password, modify the instance, or
            write to the authoritative secret.
          * Credentials are read into memory and never logged, never returned, never put
            into a metric or an exception message. Log lines carry version ids, counts
            and booleans only.
          * Only the password component of the URL is replaced. Scheme, username, host,
            port, database and query string are carried over verbatim from the existing
            application secret, and a malformed application secret aborts the run before
            anything is written.
          * Secrets Manager writes are atomic per version: a single PutSecretValue either
            fully succeeds or leaves the current version untouched.
          * Idempotent: the run is a no-op whenever the recorded source version already
            matches the authoritative version, so running every 5 minutes forever is safe
            and produces exactly one API redeployment per real rotation.

          Rotation-window handling
          ------------------------
          Managed rotation "typically completes within one minute", and during rotation
          new readers can briefly observe the previous version. Two independent guards
          prevent syncing a half-finished rotation:

          1. A settle window - the authoritative secret must not have changed within
             SETTLE_SECONDS.
          2. Stability - the authoritative AWSCURRENT version id must be observed
             unchanged across REQUIRED_STABLE_POLLS consecutive polls.

          Guard 2 deliberately keys off version id and LastChangedDate only. The
          presence of an AWSPENDING staging label is NOT used as a rotation-in-progress
          signal, because RDS left a stale AWSPENDING label on this secret that AWS never
          cleared; treating it as "rotation active" would block synchronization forever.

          ECS propagation
          ---------------
          The reconciler gets a fresh task per scheduled run, so it picks up a new secret
          value on its next run with no action. The API is a long-running task with the
          value baked in at launch, so it needs a new deployment. After a successful and
          verified sync only, this function requests a force-new-deployment of the API
          service. The task definition is not changed: this rolls the existing revision
          so the replacement task re-reads the secret.
          """

          import json
          import logging
          import os
          import time
          from datetime import datetime, timezone
          from urllib.parse import quote, unquote, urlsplit, urlunsplit

          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          LOG = logging.getLogger("credential-sync")
          LOG.setLevel(logging.INFO)

          METRIC_NAMESPACE = os.environ.get("METRIC_NAMESPACE", "Swapify/CredentialSync")
          RDS_MASTER_SECRET_ARN = os.environ["RDS_MASTER_SECRET_ARN"]
          APP_SECRET_ARN = os.environ["APP_DATABASE_URL_SECRET_ARN"]
          STATE_PARAMETER_NAME = os.environ["STATE_PARAMETER_NAME"]
          ECS_CLUSTER_NAME = os.environ["ECS_CLUSTER_NAME"]
          ECS_SERVICE_NAME = os.environ["ECS_SERVICE_NAME"]

          # Do not touch the application secret until the authoritative secret has been
          # quiet for this long.
          SETTLE_SECONDS = int(os.environ.get("SETTLE_SECONDS", "600"))
          # ...and until it has been seen unchanged on this many consecutive polls.
          REQUIRED_STABLE_POLLS = int(os.environ.get("REQUIRED_STABLE_POLLS", "2"))

          ACCEPTED_SCHEMES = ("postgres", "postgresql")

          _sm = boto3.client("secretsmanager")
          _ssm = boto3.client("ssm")
          _ecs = boto3.client("ecs")
          _cw = boto3.client("cloudwatch")


          class SyncAborted(Exception):
              """Raised for any condition that must stop the run before anything is written."""


          def _emit(name, value, unit="Count"):
              """Publish one metric. Only non-secret scalars are ever passed in."""
              _cw.put_metric_data(
                  Namespace=METRIC_NAMESPACE,
                  MetricData=[
                      {
                          "MetricName": name,
                          "Value": float(value),
                          "Unit": unit,
                          "Timestamp": datetime.now(timezone.utc),
                      }
                  ],
              )


          def _authoritative_version():
              """Return (version_id, last_changed_epoch) for the RDS secret's AWSCURRENT.

              Only the staging labels and timestamps are read; the value is not fetched
              here.
              """
              described = _sm.describe_secret(SecretId=RDS_MASTER_SECRET_ARN)
              stages = described.get("VersionIdsToStages", {})
              version_id = None
              for candidate, labels in stages.items():
                  if "AWSCURRENT" in labels:
                      version_id = candidate
                      break
              if version_id is None:
                  raise SyncAborted("authoritative secret has no AWSCURRENT version")
              last_changed = described.get("LastChangedDate")
              changed_epoch = last_changed.timestamp() if last_changed else 0.0
              return version_id, changed_epoch


          def _load_state():
              try:
                  raw = _ssm.get_parameter(Name=STATE_PARAMETER_NAME)["Parameter"]["Value"]
                  return json.loads(raw)
              except ClientError as exc:
                  if exc.response.get("Error", {}).get("Code") == "ParameterNotFound":
                      return {}
                  raise


          def _save_state(state):
              _ssm.put_parameter(
                  Name=STATE_PARAMETER_NAME,
                  Value=json.dumps(state, sort_keys=True),
                  Type="String",
                  Overwrite=True,
              )


          def _extract_password(url):
              """Return the decoded password component of a connection URL."""
              return unquote(urlsplit(url).password or "")


          def rebuild_url(current_url, authoritative_password):
              """Return current_url with only its password component replaced.

              Everything else - scheme, username, host, port, database, query, fragment -
              is carried over verbatim. Raises SyncAborted rather than producing a
              malformed URL, so a corrupt application secret can never be overwritten
              with something equally corrupt.
              """
              parts = urlsplit(current_url)
              if parts.scheme not in ACCEPTED_SCHEMES:
                  raise SyncAborted("application secret scheme is not a postgres URL")
              if not parts.hostname:
                  raise SyncAborted("application secret has no host")
              if not parts.username:
                  raise SyncAborted("application secret has no username")
              if parts.port is None:
                  raise SyncAborted("application secret has no explicit port")
              if parts.path in ("", "/"):
                  raise SyncAborted("application secret has no database name")
              netloc = "{user}:{password}@{host}:{port}".format(
                  user=quote(parts.username, safe=""),
                  password=quote(authoritative_password, safe=""),
                  host=parts.hostname,
                  port=parts.port,
              )
              return urlunsplit((parts.scheme, netloc, parts.path, parts.query, parts.fragment))


          def _request_api_redeploy():
              """Roll the API service so the long-running task re-reads the new secret.

              The task definition is untouched. ECS starts the replacement before it
              stops the previous task, so this is an ordinary rolling deployment.
              """
              _ecs.update_service(
                  cluster=ECS_CLUSTER_NAME,
                  service=ECS_SERVICE_NAME,
                  forceNewDeployment=True,
              )


          def _poll(force_now=None):
              """One synchronisation poll. Returns a small, credential-free report."""
              now = time.time()
              if force_now is not None:
                  now = force_now

              current_version, changed_epoch = _authoritative_version()
              state = _load_state()

              # No drift: nothing to do. This is the overwhelmingly common path.
              if state.get("syncedVersionId") == current_version:
                  state["observedVersionId"] = None
                  state["observedCount"] = 0
                  state["lastHeartbeatEpoch"] = int(now)
                  _save_state(state)
                  _emit("Heartbeat", 1)
                  _emit("DriftDetected", 0)
                  _emit("ConsecutiveDriftPolls", 0)
                  _emit("Settling", 0)
                      # A clean poll must publish zeroes as well as healthy signals.
                      # These two metrics are otherwise only ever emitted on the failing
                      # path, so their alarms would latch in ALARM permanently after a
                      # single transient failure and mask every later occurrence.
                  _emit("SyncFailed", 0)
                  _emit("ApiRedeployFailed", 0)
                  LOG.info(
                      "no drift: authoritative version %s already synchronised",
                      current_version,
                  )
                  return {"action": "noop", "authoritativeVersionId": current_version}

              # Drift. Track how many consecutive polls have seen this same version so a
              # rotation in progress is never copied.
              if state.get("observedVersionId") == current_version:
                  observed_count = int(state.get("observedCount", 0)) + 1
              else:
                  observed_count = 1
              state["observedVersionId"] = current_version
              state["observedCount"] = observed_count
              state["lastHeartbeatEpoch"] = int(now)
              _save_state(state)

              age_seconds = now - changed_epoch
              settling = age_seconds < SETTLE_SECONDS

              _emit("Heartbeat", 1)
              _emit("DriftDetected", 1)
              _emit("ConsecutiveDriftPolls", observed_count)
              _emit("Settling", 1 if settling else 0)

              if settling:
                  LOG.info(
                      "drift detected on authoritative version %s but it changed %.0fs ago "
                      "(settle window %ds); deferring",
                      current_version,
                      age_seconds,
                      SETTLE_SECONDS,
                  )
                  _emit("SyncFailed", 0)
                  return {"action": "settling", "authoritativeVersionId": current_version}

              if observed_count < REQUIRED_STABLE_POLLS:
                  LOG.info(
                      "drift detected on authoritative version %s, stable for %d/%d polls; deferring",
                      current_version,
                      observed_count,
                      REQUIRED_STABLE_POLLS,
                  )
                  _emit("SyncFailed", 0)
                  return {
                      "action": "awaiting_stability",
                      "authoritativeVersionId": current_version,
                  }

              # Stable and settled: synchronise.
              authoritative = json.loads(
                  _sm.get_secret_value(SecretId=RDS_MASTER_SECRET_ARN)["SecretString"]
              )
              authoritative_password = authoritative["password"]
              current_url = _sm.get_secret_value(SecretId=APP_SECRET_ARN)["SecretString"]
              new_url = rebuild_url(current_url, authoritative_password)

              _sm.put_secret_value(SecretId=APP_SECRET_ARN, SecretString=new_url)

              # Verify in memory. The password is compared, never logged.
              written_url = _sm.get_secret_value(SecretId=APP_SECRET_ARN)["SecretString"]
              if _extract_password(written_url) != authoritative_password:
                  raise SyncAborted("post-write verification of the application secret failed")

              state["syncedVersionId"] = current_version
              state["observedVersionId"] = None
              state["observedCount"] = 0
              state["lastSyncEpoch"] = int(now)
              state["lastHeartbeatEpoch"] = int(now)
              _save_state(state)

              _emit("SyncSucceeded", 1)
              _emit("DriftDetected", 0)
              _emit("ConsecutiveDriftPolls", 0)
              LOG.info(
                  "synchronised application secret from authoritative version %s",
                  current_version,
              )

              # Only now, after a verified sync, roll the API so it picks the value up.
              redeployed = True
              try:
                  _request_api_redeploy()
                  _emit("ApiRedeployRequested", 1)
                  _emit("ApiRedeployFailed", 0)
              except (ClientError, BotoCoreError) as exc:
                  # The secret is already correct, so the recorded version stays advanced;
                  # re-running will not retry the sync. Surface it loudly instead.
                  redeployed = False
                  _emit("ApiRedeployRequested", 0)
                  _emit("ApiRedeployFailed", 1)
                  _emit("SyncFailed", 1)
                  LOG.error(
                      "synchronisation succeeded but the API redeploy request failed (%s); "
                      "the API task still holds the previous credential and needs a manual "
                      "redeploy",
                      type(exc).__name__,
                  )
                  raise

              return {
                  "action": "synchronised",
                  "authoritativeVersionId": current_version,
                  "apiRedeployRequested": redeployed,
              }


          def lambda_handler(event, context):
              try:
                  return _poll()
              except (SyncAborted, ClientError, BotoCoreError, KeyError, ValueError) as exc:
                  _emit("SyncFailed", 1)
                  # type() only: an exception message can embed a connection URL.
                  LOG.error("credential sync failed: %s: %s", type(exc).__name__, _safe_detail(exc))
                  raise


          def _safe_detail(exc):
              """Reduce an exception to something that cannot contain a credential."""
              if isinstance(exc, SyncAborted):
                  return str(exc)
              if isinstance(exc, ClientError):
                  return exc.response.get("Error", {}).get("Code", "ClientError")
              if isinstance(exc, KeyError):
                  # KeyError stringifies its argument, which here would be a JSON key.
                  return "missing expected field"
              return type(exc).__name__
      Environment:
        Variables:
          METRIC_NAMESPACE: !Sub "Swapify/${EnvName}/CredentialSync"
          RDS_MASTER_SECRET_ARN: !Ref RdsMasterSecretArn
          APP_DATABASE_URL_SECRET_ARN: !Ref DatabaseUrlSecretArn
          STATE_PARAMETER_NAME: !Sub "/swapify/${EnvName}/credential-sync/rds-source-version"
          ECS_CLUSTER_NAME: !Ref Cluster
          # GetAtt Name, not Ref: Ref returns the service ARN here, and
          # ecs:UpdateService expects a bare service name.
          ECS_SERVICE_NAME: !GetAtt ApiService.Name
          # Do not copy a credential out of a rotation that may still be
          # finishing; require the authoritative version to be quiet and stable.
          SETTLE_SECONDS: "600"
          REQUIRED_STABLE_POLLS: "2"

  CredentialSyncStateParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub "/swapify/${EnvName}/credential-sync/rds-source-version"
      Type: String
      Value: "{}"

  CredentialSyncSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeCredentialSync
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt CredentialSyncFunction.Arn

  CredentialSyncSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "swapify-credential-sync-${EnvName}"
      ScheduleExpression: !Ref CredentialSyncScheduleExpression
      # OFF = fire on the exact interval. Quoted: unquoted OFF is a YAML 1.1
      # boolean, not the string "OFF".
      FlexibleTimeWindow:
        Mode: "OFF"
      State: ENABLED
      Target:
        Arn: !GetAtt CredentialSyncFunction.Arn
        RoleArn: !GetAtt CredentialSyncSchedulerRole.Arn
        RetryPolicy:
          MaximumEventAgeInSeconds: 900
          MaximumRetryAttempts: 1
        Input: '{"source":"p1.1-scheduler"}'

  CredentialSyncAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      # No subscription: alerts have no operator recipient until one is
      # confirmed. Nothing is wired to canary-demo.
      TopicName: !Sub "swapify-credential-sync-alerts-${EnvName}"
      DisplayName: !Sub "Swapify ${EnvName} credential sync alerts"

  CredentialSyncDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-credential-sync-drift"
      AlarmDescription: "The RDS-managed master credential has moved to a new version that the application secret has not caught up with. Only fires if divergence survives the settle window and the stability check."
      Namespace: !Sub "Swapify/${EnvName}/CredentialSync"
      MetricName: DriftDetected
      Statistic: Maximum
      Period: 600
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # A dead trigger is the heartbeat alarm's job. Reporting it here too would
      # double-page for one fault.
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CredentialSyncAlertTopic
      OKActions:
        - !Ref CredentialSyncAlertTopic

  CredentialSyncFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-credential-sync-failure"
      AlarmDescription: "The credential sync function failed a step. The application secret was left untouched and the recorded source version was not advanced."
      Namespace: !Sub "Swapify/${EnvName}/CredentialSync"
      MetricName: SyncFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CredentialSyncAlertTopic
      OKActions:
        - !Ref CredentialSyncAlertTopic

  CredentialSyncRedeployFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-credential-sync-api-redeploy-failed"
      AlarmDescription: "The credential was synchronised but the API redeploy request failed, so the running API task may still hold the previous credential and needs a manual redeploy."
      Namespace: !Sub "Swapify/${EnvName}/CredentialSync"
      MetricName: ApiRedeployFailed
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref CredentialSyncAlertTopic
      OKActions:
        - !Ref CredentialSyncAlertTopic

  CredentialSyncHeartbeatAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "swapify-${EnvName}-credential-sync-heartbeat-missing"
      AlarmDescription: "No credential sync poll reported in 15 minutes. The trigger itself is broken (schedule disabled, target misconfigured, or the function erroring before it can publish), which no other alarm here can distinguish from healthy silence."
      Namespace: !Sub "Swapify/${EnvName}/CredentialSync"
      MetricName: Heartbeat
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      # Absent data is the failure being detected, so it must breach.
      TreatMissingData: breaching
      AlarmActions:
        - !Ref CredentialSyncAlertTopic
      OKActions:
        - !Ref CredentialSyncAlertTopic

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ApiDomain:
    Value: !Ref ApiDomainName
  WebDomain:
    Value: !Ref WebDomainName
  ReconcilerScheduleArn:
    Description: EventBridge Scheduler schedule that runs the one-shot reconciler.
    Value: !Ref ReconcilerSchedule
  ReconcilerTaskDefinition:
    Description: Task definition used by the reconciliation schedule.
    Value: !Ref ReconcilerTaskDefinition
  ReconciliationAlertTopicArn:
    Description: Dedicated Swapify reconciliation observability alert topic. Has no subscription until an operator endpoint is confirmed.
    Value: !Ref ReconciliationAlertTopic
  ReconcilerObservabilityLogGroups:
    Description: "R3.38 observability log groups, name:retentionMs"
    Value: !Sub "/ecs/swapify/${EnvName}/reconciler:300d, /ecs/swapify/${EnvName}/reconciler-task-events:300d"
  ReconcilerObservabilityMetrics:
    Description: "R3.38 metric filters, name:logGroup"
    Value: !Sub "ReconcilerRunStarted,ReconcilerRunFailed,ReconcilerStepError,ReconcilerRunDuration:/ecs/swapify/${EnvName}/reconciler; ReconcilerTaskFailed:/ecs/swapify/${EnvName}/reconciler-task-events"
  CredentialSyncFunctionArn:
    Description: Function that synchronises the application DATABASE_URL with the RDS-managed master credential.
    Value: !GetAtt CredentialSyncFunction.Arn
  CredentialSyncScheduleArn:
    Description: EventBridge Scheduler schedule that drives the credential sync polls.
    Value: !Ref CredentialSyncSchedule
  CredentialSyncAlertTopicArn:
    Description: Dedicated credential sync alert topic. Has no subscription until an operator endpoint is confirmed.
    Value: !Ref CredentialSyncAlertTopic
  CredentialSyncStateParameterName:
    Description: Parameter holding the last synchronised authoritative version id (non-secret).
    Value: !Ref CredentialSyncStateParameter
