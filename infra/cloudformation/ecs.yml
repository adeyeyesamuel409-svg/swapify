AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - ECS Fargate services for the API and web app behind an Application Load Balancer"

Parameters:
  EnvName:
    Type: String
    Default: prod
  VpcId:
    Type: AWS::EC2::VPC::Id
  LoadBalancerSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  ApiSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  WebSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  LoadBalancerSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output LoadBalancerSecurityGroupId.
  ApiSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output ApiSecurityGroupId.
  WebSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output WebSecurityGroupId.
  ApiImage:
    Type: String
    Description: 'ECR image URI for the API: <account>.dkr.ecr.us-east-1.amazonaws.com/swapify-api:<git-sha> (build with npm run build -w @swapify/api; NODE_ENV=production).'
  WebImage:
    Type: String
    Description: 'ECR image URI for the web app: <account>.dkr.ecr.us-east-1.amazonaws.com/swapify-web:<git-sha> (build with NEXT_PUBLIC_IMAGE_BASE_URL set to the CDN base URL).'
  ApiDomainName:
    Type: String
    Description: Public host for the API, e.g. api.swapifyuk.com
  WebDomainName:
    Type: String
    Description: Public host for the web app, e.g. swapifyuk.com
  CertificateArn:
    Type: String
    Description: ACM certificate ARN covering ApiDomainName, WebDomainName and the www.swapifyuk.com SAN.
  ApiDesiredCount:
    Type: Number
    Default: 1
  WebDesiredCount:
    Type: Number
    Default: 1
  ApiCpu:
    Type: String
    Default: "256"
  ApiMemory:
    Type: String
    Default: "512"
  WebCpu:
    Type: String
    Default: "1024"
  WebMemory:
    Type: String
    Default: "2048"
  CognitoRegion:
    Type: String
    Default: us-east-1
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  CognitoIssuer:
    Type: String
    Description: https://cognito-idp.<region>.amazonaws.com/<user-pool-id>
  S3Bucket:
    Type: String
  S3Prefix:
    Type: String
    Default: uploads
  CdnBaseUrl:
    Type: String
    Description: CloudFront base URL from the storage stack output.
  StorageAccessPolicyArn:
    Type: String
    Description: ApiStorageAccessPolicyArn from the storage stack.
  DatabaseUrlSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/database-url.
  StripeSecretKeySecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/stripe/secret-key.
  StripeWebhookSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/stripe/webhook-secret.
  NextAuthSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/web/nextauth-secret.
  CognitoClientSecretSecretArn:
    Type: String
    Description: Secrets Manager ARN of swapify/web/cognito-client-secret.

Resources:
  # --- Networking -----------------------------------------------------------
  # VPC, subnets, NAT routing and all security groups are owned by
  # infra/cloudformation/networking.yml and consumed via parameters.

  # --- IAM ------------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadTaskSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref StripeSecretKeySecretArn
                  - !Ref StripeWebhookSecretSecretArn
                  - !Ref NextAuthSecretSecretArn
                  - !Ref CognitoClientSecretSecretArn

  ApiTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref StorageAccessPolicyArn
      Policies:
        - PolicyName: ReadApiSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatabaseUrlSecretArn
                  - !Ref StripeSecretKeySecretArn
                  - !Ref StripeWebhookSecretSecretArn

  WebTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReadWebSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref NextAuthSecretSecretArn
                  - !Ref CognitoClientSecretSecretArn

  # --- Cluster + tasks ------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "swapify-${EnvName}"
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "swapify-api-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref ApiCpu
      Memory: !Ref ApiMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt ApiTaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ApiImage
          Essential: true
          Cpu: 0
          HealthCheck:
            Command: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "4000"
            - Name: HOST
              Value: 0.0.0.0
            - Name: LOG_LEVEL
              Value: info
            - Name: AWS_REGION
              Value: !Ref CognitoRegion
            - Name: COGNITO_REGION
              Value: !Ref CognitoRegion
            - Name: COGNITO_USER_POOL_ID
              Value: !Ref CognitoUserPoolId
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: WEB_BASE_URL
              Value: !Sub "https://${WebDomainName}"
            - Name: STORAGE_DRIVER
              Value: s3
            - Name: S3_BUCKET
              Value: !Ref S3Bucket
            - Name: S3_PREFIX
              Value: !Ref S3Prefix
            - Name: CDN_BASE_URL
              Value: !Ref CdnBaseUrl
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecretArn
            - Name: STRIPE_SECRET_KEY
              ValueFrom: !Ref StripeSecretKeySecretArn
            - Name: STRIPE_WEBHOOK_SECRET
              ValueFrom: !Ref StripeWebhookSecretSecretArn
          PortMappings:
            - ContainerPort: 4000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: api

  WebTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "swapify-web-${EnvName}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref WebCpu
      Memory: !Ref WebMemory
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt WebTaskRole.Arn
      ContainerDefinitions:
        - Name: web
          Image: !Ref WebImage
          Essential: true
          Cpu: 0
          HealthCheck:
            Command: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: NEXTAUTH_URL
              Value: !Sub "https://${WebDomainName}"
            - Name: COGNITO_CLIENT_ID
              Value: !Ref CognitoClientId
            - Name: COGNITO_ISSUER
              Value: !Ref CognitoIssuer
            - Name: API_URL
              Value: !Sub "https://${ApiDomainName}"
          Secrets:
            - Name: NEXTAUTH_SECRET
              ValueFrom: !Ref NextAuthSecretSecretArn
            - Name: COGNITO_CLIENT_SECRET
              ValueFrom: !Ref CognitoClientSecretSecretArn
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WebLogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: web

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: ApiListenerRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "swapify-api-${EnvName}"
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !Ref ApiDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApiSecurityGroupId]
          Subnets: !Ref ApiSubnets
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 4000
          TargetGroupArn: !Ref ApiTargetGroup

  WebService:
    Type: AWS::ECS::Service
    DependsOn: WebListenerRule
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "swapify-web-${EnvName}"
      TaskDefinition: !Ref WebTaskDefinition
      DesiredCount: !Ref WebDesiredCount
      LaunchType: FARGATE
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref WebSecurityGroupId]
          Subnets: !Ref WebSubnets
      LoadBalancers:
        - ContainerName: web
          ContainerPort: 3000
          TargetGroupArn: !Ref WebTargetGroup

  # --- Load balancer --------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "swapify-alb-${EnvName}"
      Type: application
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroupId]
      Subnets: !Ref LoadBalancerSubnets

  ApiTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "swapify-api-tg-${EnvName}"
      VpcId: !Ref VpcId
      Port: 4000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "swapify-web-tg-${EnvName}"
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 3
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  ApiListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApiTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref ApiDomainName]

  # NOTE: www.swapifyuk.com is covered by the certificate SAN, but there is no
  # ALB listener rule for it yet. A host-header redirect rule (www.swapifyuk.com
  # -> https://swapifyuk.com, HTTP 301) must be added in a reviewed
  # infrastructure change before DNS points www at the ALB; pointing it at the
  # ALB without a matching rule yields no listener match.
  WebListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 20
      Actions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Ref WebDomainName]

  # --- Logging --------------------------------------------------------------
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/api"
      RetentionInDays: 30
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/swapify/${EnvName}/web"
      RetentionInDays: 30

Outputs:
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ApiDomain:
    Value: !Ref ApiDomainName
  WebDomain:
    Value: !Ref WebDomainName
