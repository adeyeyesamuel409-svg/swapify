AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - RDS PostgreSQL 16 (private, encrypted, RDS-managed password secret)"

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: Environment name used in resource names and tags.
  DbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: From the networking stack output DbSubnetIds (private subnets).
  RdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From the networking stack output RdsSecurityGroupId (5432 from the API SG only).
  DbEngineVersion:
    Type: String
    Default: 16.15
    Description: PostgreSQL engine version (matches local postgres:16 development).
  DbInstanceClass:
    Type: String
    Default: db.t4g.small
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
    Description: RDS instance class. db.t4g.small is the production baseline (owner decision).
  AllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 100
    Description: Storage in GiB (gp3).
  DbName:
    Type: String
    Default: swapify
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ConstraintDescription: Must start with a letter and contain only letters, digits or underscores.
    Description: Initial database name.
  MasterUsername:
    Type: String
    Default: swapify_app
    AllowedPattern: "^[A-Za-z][A-Za-z0-9_]*$"
    ConstraintDescription: Must start with a letter and contain only letters, digits or underscores.
    Description: Master user name. The password is generated by RDS (MasterUserSecret) - never pass one here.
  BackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 0
    MaxValue: 35
    Description: Daily automated backup retention in days.
  DeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Prevent accidental deletion of the production database.
  MultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Multi-AZ deployment for high availability. Owner decision (adds cost).
  StorageType:
    Type: String
    Default: gp3
    AllowedValues: [gp2, gp3]

Conditions:
  EnableDeletionProtection: !Equals [!Ref DeletionProtection, "true"]
  EnableMultiAz: !Equals [!Ref MultiAz, "true"]

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "Private subnets for the Swapify ${EnvName} database"
      DBSubnetGroupName: !Sub "swapify-${EnvName}-db-subnet-group"
      SubnetIds: !Ref DbSubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: !Sub "swapify-${EnvName}"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: !Ref AllocatedStorage
      StorageType: !Ref StorageType
      StorageEncrypted: true
      DBName: !Ref DbName
      MasterUsername: !Ref MasterUsername
      MasterUserSecret: {}
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroupId
      PubliclyAccessible: false
      MultiAZ: !If [EnableMultiAz, true, false]
      BackupRetentionPeriod: !Ref BackupRetentionDays
      DeletionProtection: !If [EnableDeletionProtection, true, false]
      Tags:
        - Key: Name
          Value: !Sub "swapify-${EnvName}"
        - Key: Environment
          Value: !Ref EnvName

Outputs:
  RdsEndpoint:
    Description: RDS writer endpoint hostname. Used to build the DATABASE_URL secret at deploy time.
    Value: !GetAtt Database.Endpoint.Address
  RdsPort:
    Description: RDS listener port.
    Value: !GetAtt Database.Endpoint.Port
  RdsDbName:
    Description: Initial database name.
    Value: !Ref DbName
  RdsMasterUserSecretArn:
    Description: Secret Manager ARN of the RDS-generated master password. Retrieve at deploy time to build DATABASE_URL; never print the value.
    Value: !GetAtt Database.MasterUserSecret.SecretArn
  RdsArn:
    Description: ARN of the RDS instance.
    Value: !GetAtt Database.DBInstanceArn