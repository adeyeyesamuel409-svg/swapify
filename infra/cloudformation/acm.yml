AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - ACM certificates for swapifyuk.com, api.swapifyuk.com and www.swapifyuk.com (DNS validation, us-east-1)"

Parameters:
  EnvName:
    Type: String
    Default: prod
    Description: Environment name used in resource tags.
  DomainName:
    Type: String
    Default: swapifyuk.com
    Description: Primary domain the certificate covers.
  SubjectAlternativeNames:
    Type: List<String>
    Default: "api.swapifyuk.com,www.swapifyuk.com"
    Description: Additional domains covered by the certificate.

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: !Ref SubjectAlternativeNames
      ValidationMethod: DNS
      Tags:
        - Key: Environment
          Value: !Ref EnvName

Outputs:
  CertificateArn:
    Description: ACM certificate ARN to pass to the ECS (ALB) stack.
    Value: !Ref Certificate