AWSTemplateFormatVersion: "2010-09-09"
Description: "Swapify - Cognito user pool + Hosted UI for authentication (Sprint 1)"

Parameters:
  PoolName:
    Type: String
    Default: swapify-users
  CognitoDomainPrefix:
    Type: String
    Default: swapify-auth-588170396448
  AppCallbackUrl:
    Type: String
    Default: http://localhost:3000/api/auth/callback/cognito
  AppLogoutUrl:
    Type: String
    Default: http://localhost:3000

Resources:
  # The user directory: our users, their passwords, and email verification.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref PoolName
      # Users sign in with their email address.
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Allow self-sign-up (not just admin-created accounts).
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  # OAuth client for the web app (Auth.js). Secret is generated by Cognito.
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: swapify-web
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - !Ref AppCallbackUrl
      LogoutURLs:
        - !Ref AppLogoutUrl
      SupportedIdentityProviders:
        - COGNITO
      # Server-side admin auth (used by CLI/scripts/tests to mint access tokens).
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # The public URL Cognito hosts the sign-in / sign-up pages on.
  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref CognitoDomainPrefix
      UserPoolId: !Ref UserPool

Outputs:
  UserPoolId:
    Description: Cognito user pool ID
    Value: !Ref UserPool
  UserPoolDomain:
    Description: Hosted UI domain prefix
    Value: !Ref CognitoDomainPrefix
  ClientId:
    Description: OAuth app client ID
    Value: !Ref UserPoolClient
  Region:
    Description: AWS region
    Value: !Ref AWS::Region
